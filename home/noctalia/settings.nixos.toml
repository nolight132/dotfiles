config_version = 11

[bar.default]
auto_hide = true
end = [
    "cpu",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
reserve_space = false
show_on_workspace_switch = false
start = [ "launcher", "wallpaper", "workspaces", "media" ]
widget_spacing = 10

[dock]
auto_hide = true
cross_axis_padding = 4
enabled = true
icon_size = 28
inactive_opacity = 0.99999997764825821
inactive_scale = 1.0
magnification = false
main_axis_padding = 12
pinned = [ "zen", "com.mitchellh.ghostty", "dev.zed.Zed", "vesktop", "cider-2" ]
reserve_space = false
shadow = false
show_instance_count = false

[hooks]
wallpaper_changed = "$HOME/.config/noctalia/hooks/matugen.sh"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1024.0
    cy = 970.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1024.0
    cy = 970.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
monitors = [ "DP-2" ]
position = "bottom_right"
show_actions = false

[shell]
clipboard_enabled = false
popup_shadows = false

    [shell.shadow]
    alpha = 0.0

[theme]
builtin = "Ayu"
community_palette = "ADW"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "niri", "qt" ]
    community_ids = [ "vicinae", "papirus-icons" ]

[wallpaper]
directory = "/home/nolight/Pictures/Wallpapers/Fractal Maze"
transition = [ "fade" ]

    [wallpaper.default]
    path = "/home/nolight/Pictures/Wallpapers/Fractal Maze/46.jpg"

    [wallpaper.last]
    path = "/home/nolight/Pictures/Wallpapers/Fractal Maze/46.jpg"

    [wallpaper.monitors.DP-1]
