[widget.battery]
enabled = false

[widget.brightness]
enabled = false

[widget.clipboard]
enabled = false

[widget.control-center]
enabled = false

[widget.cpu]
scale = 0.90000000000000013

[widget.launcher]
enabled = false

[widget.network]
show_label = false

[widget.tray]
drawer = true
drawer_columns = 5
drawer_item_size = 19.0
hidden = [ "blueman" ]

[widget.volume]
show_label = false

